<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>まきばづくり</title>
<style>
:root{--wood:#7a5230;--wood2:#5a3a20;--paper:#f8eed6;--paper2:#efdfba;--ink:#4a3320;--leaf:#5c9b3a;--red:#c8463a}
html,body{margin:0;height:100%;overflow:hidden;background:#cfe7f3;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.wood{background:var(--paper);border:3px solid var(--wood);border-radius:16px;box-shadow:0 5px 0 var(--wood2),0 10px 24px rgba(0,0,0,.22)}
#panel{position:fixed;top:12px;right:12px;bottom:12px;width:300px;display:flex;flex-direction:column;overflow:hidden}
#panel h2{margin:0;padding:12px 16px 6px;font-size:17px;letter-spacing:.08em;display:flex;align-items:center;gap:8px}
#panel h2 small{font-size:11px;font-weight:normal;opacity:.7;letter-spacing:0}
#tabs{display:flex;gap:4px;padding:4px 10px 8px;flex-wrap:wrap}
#tabs button{flex:1;min-width:0;padding:7px 4px;border:2px solid var(--wood);border-radius:10px;background:var(--paper2);color:var(--ink);font:inherit;font-size:13px;cursor:pointer}
#tabs button.on{background:var(--leaf);color:#fff;border-color:#3f7326}
#grid{flex:1;overflow-y:auto;padding:4px 10px 10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-content:start}
.card{position:relative;border:2px solid #c9a978;border-radius:12px;background:#fffaf0;padding:4px 2px 6px;cursor:pointer;text-align:center;font:inherit;color:var(--ink);transition:transform .08s}
.card:hover{transform:translateY(-2px);border-color:var(--wood)}
.card.on{border-color:var(--leaf);background:#eaf6dc;box-shadow:0 0 0 3px rgba(92,155,58,.35)}
.card img{width:100%;aspect-ratio:1;display:block;object-fit:contain}
.card .nm{font-size:12.5px;font-weight:bold}
.card .bd{position:absolute;top:3px;left:3px;font-size:9.5px;padding:1px 5px;border-radius:6px;background:#b9a68a;color:#fff}
.card .bd.tripo{background:#6a4bd6}
.card .key{position:absolute;top:3px;right:5px;font-size:10px;opacity:.5}
#btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-top:2px dashed #d4b98c}
#btns button,#seltools button{border:2px solid var(--wood);border-radius:10px;background:var(--paper2);color:var(--ink);font:inherit;font-size:13px;padding:8px 4px;cursor:pointer}
#btns button:hover,#seltools button:hover{background:#fff4dc}
#btns button.wide{grid-column:span 2;background:var(--leaf);color:#fff;border-color:#3f7326}
#hud{position:fixed;top:12px;left:12px;padding:10px 14px;display:flex;align-items:center;gap:14px}
#hud .t{font-size:16px;font-weight:bold;letter-spacing:.06em}
#hud .n{font-size:13px;background:#fffaf0;border:2px solid #d4b98c;border-radius:10px;padding:3px 10px}
#hud .n b{font-size:16px;color:var(--leaf)}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(calc(-50% - 156px));padding:8px 16px;font-size:13px;line-height:1.9;text-align:center;max-width:calc(100vw - 380px);box-sizing:border-box}
#hint .sep{opacity:.35;margin:0 6px}
#hint kbd{display:inline-block;border:1.5px solid #b89a6a;border-bottom-width:3px;border-radius:6px;padding:0 5px;margin:0 2px;font:inherit;font-size:11.5px;background:#fff}
#seltools{position:fixed;display:flex;gap:4px;padding:5px;transform:translate(-50%,-100%);border-radius:12px}
#seltools button{padding:5px 8px;font-size:12.5px}
#seltools button.del{background:#f6d4cf;border-color:var(--red);color:#8a2018}
#toast{position:fixed;left:50%;top:74px;z-index:5;transform:translateX(calc(-50% - 156px));padding:8px 18px;border-radius:12px;background:rgba(74,51,32,.92);color:#fff;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.hidden{display:none!important}
#mode{position:fixed;left:50%;top:12px;transform:translateX(calc(-50% - 156px));padding:8px 10px 8px 16px;display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap}
#mode.place{background:#eaf6dc;border-color:#3f7326}
#mode.sel{background:#fff3c9;border-color:#b88a1a}
#mode button{border:2px solid var(--wood);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:12.5px;padding:4px 10px;cursor:pointer}
#cam{position:fixed;left:12px;top:74px;padding:8px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:186px}
#cam .lb{grid-column:span 3;font-size:11px;opacity:.7;padding:0 2px}
#cam button{border:2px solid var(--wood);border-radius:10px;background:var(--paper2);color:var(--ink);font:inherit;font-size:12px;padding:6px 2px;cursor:pointer}
#cam button:hover{background:#fff4dc}
#cam button.on{background:var(--leaf);color:#fff;border-color:#3f7326}
#cam button.w3{grid-column:span 3}
#why{position:fixed;padding:4px 10px;border-radius:10px;background:rgba(200,50,40,.95);color:#fff;font-size:13px;font-weight:bold;pointer-events:none;white-space:nowrap;z-index:4;box-shadow:0 3px 8px rgba(0,0,0,.25)}
body.clean .ui{display:none!important}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body.touch #seltools button{padding:9px 11px;font-size:14px;white-space:nowrap}
body.touch .card:hover{transform:none}
#tabs .mini{display:none}
@media (max-width:800px){
  .pc{display:none}
  #hud{top:8px;left:8px;padding:5px 8px;gap:6px;border-width:2px;border-radius:12px}
  #hud .t{display:none} #hud .n{font-size:11px;padding:3px 8px;white-space:nowrap} #hud .n b{font-size:13px}
  #cam{top:8px;left:auto;right:8px;width:auto;display:flex;padding:4px;gap:3px;border-width:2px;border-radius:12px}
  #cam .lb,#cam [data-c=rl],#cam [data-c=rr],#cam [data-c=in],#cam [data-c=out],#cam [data-c=left],#cam [data-c=right]{display:none}
  #cam button{padding:6px 9px;font-size:12px;white-space:nowrap;border-radius:8px}
  #panel{top:auto;left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));width:auto;height:auto;border-width:2px;border-radius:14px}
  #panel h2{display:none}
  #tabs{padding:6px 6px 5px;flex-wrap:nowrap;gap:3px} #tabs button{padding:7px 2px;font-size:12px;white-space:nowrap;border-radius:8px}
  #tabs .mini{display:block;flex:0 0 38px;background:#fff}
  #grid{flex:none;display:flex;overflow-x:auto;overflow-y:hidden;gap:5px;padding:0 6px 6px;-webkit-overflow-scrolling:touch}
  .card{flex:0 0 62px;padding:2px 1px 3px;border-radius:10px} .card .key{display:none} .card .nm{font-size:10.5px;white-space:nowrap}
  .card .bd{font-size:8px;padding:0 4px}
  #btns{display:none;grid-template-columns:1.1fr .8fr 1.1fr 1fr;padding:6px;gap:4px}
  body.menu #btns{display:grid}
  #btns button{font-size:11px;padding:8px 0;white-space:nowrap;overflow:hidden} #btns button.wide{grid-column:auto}
  #btns #bUndo{display:none}
  #mode{top:auto;bottom:calc(var(--ph,160px) + 2px);left:6px;transform:none;font-size:12px;padding:4px 5px 4px 10px;gap:8px;border-width:2px;border-radius:12px;max-width:calc(100vw - 12px);box-sizing:border-box}
  #mode:not(.place){display:none}
  #mode button{padding:6px 10px}
  #hint{transform:translateX(-50%);bottom:calc(var(--ph,160px) + 4px);font-size:11px;line-height:1.6;padding:4px 10px;width:max-content;max-width:calc(100vw - 12px);border-width:2px;border-radius:12px;pointer-events:none;opacity:.95}
  body.used #hint{display:none}
  #toast{transform:translateX(-50%);top:58px;width:max-content;max-width:calc(100vw - 32px);font-size:13px;text-align:center}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="hud" class="wood ui">
  <div class="t">🌱 まきばづくり</div>
  <div class="n">置いた数 <b id="count">0</b></div>
</div>

<aside id="panel" class="wood ui">
  <h2>素材 <small>えらんで、地面をクリック</small></h2>
  <div id="tabs"></div>
  <div id="grid"></div>
  <div id="btns">
    <button id="bUndo">↶ 元に戻す</button>
    <button id="bClear">更地に戻す</button>
    <button id="bSave">💾 保存</button>
    <button id="bLoad">📂 読み込み</button>
    <button id="bSample" class="wide">✨ お手本<span class="pc">の牧場をつくる</span></button>
  </div>
</aside>

<div id="mode" class="wood ui"></div>
<div id="cam" class="wood ui">
  <div class="lb">カメラ</div>
  <button data-c="home" title="1つ前の全体ビューに戻す">全体</button>
  <button data-c="top" title="真上から見る">真上</button>
  <button data-c="near" title="低い位置から近くで見る">寄り</button>
  <button data-c="rl" title="左に回す">↺ 回す</button>
  <button data-c="in" title="拡大">＋</button>
  <button data-c="rr" title="右に回す">回す ↻</button>
  <button data-c="left" title="左へ移動">←</button>
  <button data-c="out" title="縮小">－</button>
  <button data-c="right" title="右へ移動">→</button>
  <button data-c="walk" class="w3 on" id="bWalk">🐾<span class="pc"> 動物が歩く：</span>ON</button>
</div>
<div id="why" class="ui hidden"></div>
<div id="hint" class="wood ui"></div>
<div id="seltools" class="wood ui hidden">
  <button data-a="rl" title="Q">↺</button>
  <button data-a="rr" title="E">↻</button>
  <button data-a="sm" title="[">小</button>
  <button data-a="lg" title="]">大</button>
  <button data-a="dup" title="C">複製</button>
  <button data-a="del" class="del" title="Delete">削除</button>
</div>
<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const V3 = THREE.Vector3;
const PANEL_W = 324;
const AREA = { x0: -22, x1: 22, z0: -18, z1: 18 };
const params = new URLSearchParams(location.search);
const TOUCH = matchMedia('(pointer:coarse)').matches || params.get('touch') === '1', isMob = () => innerWidth <= 800;
document.body.classList.toggle('touch', TOUCH);

/* ---------- seeded random ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd = mulberry32(7);

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
{
  const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256;
  const g = cv.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5fb0ea'); gr.addColorStop(0.55, '#a9d6f2'); gr.addColorStop(1, '#e8f4f6');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.fog = new THREE.Fog(0xd8ecf2, 70, 170);

const camera = new THREE.PerspectiveCamera(36, 1, 0.5, 500);
camera.position.set(0, 15.5, 21);
if (isMob()) camera.position.set(0, 67, 36); // portrait phones: start further out so the whole lot is visible
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 0, -3);
controls.mouseButtons = { LEFT: -1, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: -1, TWO: -1 }; // touch gestures are handled below (pinch / two-finger pan / twist)
controls.enableDamping = true; controls.dampingFactor = 0.12;
controls.minDistance = 3.5; controls.maxDistance = 55; controls.enableZoom = false; controls.enableRotate = false;
controls.minPolarAngle = 0.04; controls.maxPolarAngle = 1.3;
controls.screenSpacePanning = false;

scene.add(new THREE.HemisphereLight(0xe3f3ff, 0x8a7442, 1.15));
const sun = new THREE.DirectionalLight(0xfff0d2, 2.5);
sun.position.set(-16, 30, 18);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 90 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun);

/* ---------- helpers ---------- */
const matCache = new Map();
function M(color, o = {}) {
  const k = color + JSON.stringify(o);
  if (!matCache.has(k)) matCache.set(k, new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...o }));
  return matCache.get(k);
}
function mesh(geo, mat, x = 0, y = 0, z = 0, parent) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  if (parent) parent.add(m); return m;
}
const SPH = new THREE.SphereGeometry(1, 16, 12);
const SPH_LO = new THREE.SphereGeometry(1, 9, 7);
const box = (w, h, d, r = 0.03) => new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2 - 1e-3, h / 2 - 1e-3, d / 2 - 1e-3));
const cyl = (rt, rb, h, s = 14) => new THREE.CylinderGeometry(rt, rb, h, s);
function leaf(parent, a, tilt, len, wid, color, y = 0) {
  const p = new THREE.Group(); p.position.y = y; p.rotation.y = a; parent.add(p);
  const t = new THREE.Group(); t.rotation.x = -tilt; p.add(t);
  const m = mesh(SPH_LO, M(color, { flatShading: true }), 0, 0, len * 0.5, t);
  m.scale.set(wid, wid * 0.25, len * 0.5); return m;
}
function gable(w, h, depth, color) { // triangle prism, ridge along X, base at y=0
  const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: false });
  g.translate(0, 0, -depth / 2); g.rotateY(Math.PI / 2);
  return new THREE.Mesh(g, M(color));
}
function textTexture(text, bg, fg) {
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 128;
  const g = cv.getContext('2d'); g.fillStyle = bg; g.fillRect(0, 0, 256, 128);
  g.fillStyle = fg; g.font = 'bold 54px "Hiragino Maru Gothic ProN", sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 128, 68);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; return t;
}

/* ---------- procedural placeholder models (swapped for Tripo GLBs when present) ---------- */
function soil() {
  const g = new THREE.Group();
  mesh(box(0.98, 0.1, 0.98, 0.03), M('#6e4527'), 0, 0.05, 0, g);
  for (const z of [-0.24, 0.24]) { const r = mesh(box(0.88, 0.07, 0.26, 0.03), M('#7d5232'), 0, 0.1, z, g); }
  return g;
}
function turnip() {
  const g = new THREE.Group();
  const b = mesh(SPH, M('#f6f2ea', { roughness: 0.55 }), 0, 0.2, 0, g); b.scale.set(0.22, 0.2, 0.22);
  const tip = mesh(new THREE.ConeGeometry(0.06, 0.16, 10), M('#efe6d6'), 0, 0.03, 0, g); tip.rotation.x = Math.PI;
  const cap = mesh(SPH, M('#e2ecc9'), 0, 0.33, 0, g); cap.scale.set(0.12, 0.06, 0.12);
  for (let i = 0; i < 6; i++) leaf(g, i / 6 * Math.PI * 2 + 0.3, 0.75 + (i % 2) * 0.25, 0.5, 0.15, i % 2 ? '#4f9a3a' : '#5eab43', 0.34);
  return g;
}
function carrot() {
  const g = new THREE.Group();
  mesh(cyl(0.1, 0.07, 0.14), M('#f08a24', { roughness: 0.6 }), 0, 0.06, 0, g);
  for (let i = 0; i < 7; i++) {
    const a = i / 7 * Math.PI * 2;
    leaf(g, a, 1.05 + (i % 3) * 0.12, 0.45, 0.07, '#5aa83c', 0.12);
    leaf(g, a + 0.2, 0.9, 0.3, 0.09, '#6cbd47', 0.12);
  }
  return g;
}
function strawberry() {
  const g = new THREE.Group();
  for (let i = 0; i < 7; i++) leaf(g, i / 7 * Math.PI * 2, 0.35 + (i % 2) * 0.25, 0.34, 0.15, i % 2 ? '#3f8a35' : '#4c9b3e', 0.07);
  const red = M('#e0302f', { roughness: 0.45 });
  [[0.2, 0.1, 0.05], [-0.12, 0.09, 0.18], [-0.1, 0.11, -0.18], [0.08, 0.12, -0.22]].forEach(([x, y, z]) => {
    const c = mesh(new THREE.ConeGeometry(0.065, 0.13, 10), red, x, y, z, g); c.rotation.x = Math.PI;
    mesh(SPH_LO, M('#3f8a35'), x, y + 0.07, z, g).scale.set(0.05, 0.015, 0.05);
  });
  for (let i = 0; i < 5; i++) { const a = i / 5 * Math.PI * 2; mesh(SPH_LO, M('#ffffff'), Math.cos(a) * 0.04, 0.26, 0.05 + Math.sin(a) * 0.04, g).scale.setScalar(0.035); }
  mesh(SPH_LO, M('#f3c32b'), 0, 0.265, 0.05, g).scale.setScalar(0.025);
  return g;
}
function cow() {
  const g = new THREE.Group(); const body = new THREE.Group(); body.name = 'body'; g.add(body);
  const W = M('#f7f4ee'), B = M('#2b2724'), P = M('#f2b2ac'), H = M('#3a2f2a');
  const C = new V3(0, 0.95, 0);
  const torso = mesh(new THREE.CapsuleGeometry(0.42, 0.75, 8, 18), W, 0, 0.95, 0, body); torso.rotation.x = Math.PI / 2;
  [[1, 0.3, 0.15], [-1, 0.5, -0.2], [0.2, 1, -0.3], [-0.8, -0.4, 0.28], [0.9, -0.2, -0.32], [-0.3, 1, 0.25]].forEach(([nx, ny, z]) => {
    const n = new V3(nx, ny, 0).normalize();
    const s = mesh(SPH, B, C.x + n.x * 0.41, C.y + n.y * 0.41, z, body);
    s.lookAt(C.x + n.x * 3, C.y + n.y * 3, z); s.scale.set(0.2, 0.15, 0.05);
  });
  for (const x of [-0.24, 0.24]) for (const z of [-0.42, 0.42]) {
    mesh(cyl(0.09, 0.08, 0.55), W, x, 0.33, z, body);
    mesh(cyl(0.095, 0.095, 0.08), H, x, 0.04, z, body);
  }
  mesh(SPH, P, 0, 0.58, -0.22, body).scale.set(0.14, 0.08, 0.14);
  const head = new THREE.Group(); head.position.set(0, 1.18, 0.8); body.add(head); head.name = 'head';
  mesh(box(0.46, 0.44, 0.48, 0.13), W, 0, 0, 0, head);
  mesh(box(0.44, 0.22, 0.2, 0.08), P, 0, -0.12, 0.24, head);
  for (const x of [-0.08, 0.08]) mesh(SPH_LO, H, x, -0.1, 0.345, head).scale.setScalar(0.025);
  for (const x of [-0.13, 0.13]) mesh(SPH_LO, B, x, 0.07, 0.235, head).scale.setScalar(0.045);
  mesh(SPH, B, 0.12, 0.17, 0.16, head).scale.set(0.12, 0.07, 0.1);
  for (const s of [-1, 1]) {
    const h = mesh(new THREE.ConeGeometry(0.04, 0.16, 8), M('#efe3c2'), s * 0.16, 0.27, -0.02, head); h.rotation.z = -s * 0.55;
    mesh(SPH_LO, W, s * 0.28, 0.1, -0.03, head).scale.set(0.13, 0.05, 0.08);
  }
  const collar = mesh(new THREE.TorusGeometry(0.24, 0.03, 8, 20), M('#9b3b2a'), 0, 1.0, 0.62, body); collar.rotation.x = Math.PI / 2 - 0.5;
  mesh(SPH, M('#e7b53c', { metalness: 0.6, roughness: 0.35 }), 0, 0.8, 0.74, body).scale.setScalar(0.07);
  const tail = mesh(cyl(0.025, 0.025, 0.55, 6), W, 0, 0.82, -0.82, body); tail.rotation.x = 0.25;
  mesh(SPH_LO, B, 0, 0.55, -0.88, body).scale.set(0.06, 0.1, 0.06);
  return g;
}
function sheep() {
  const g = new THREE.Group(); const body = new THREE.Group(); body.name = 'body'; g.add(body);
  const W = M('#f6f1e4', { roughness: 1 }), F = M('#efd9c4'), D = M('#4a3b33');
  mesh(SPH, W, 0, 0.72, 0, body).scale.set(0.45, 0.38, 0.55);
  for (let i = 0; i < 18; i++) {

async function loadTripoModels() {
  let man; try { const r = await fetch('models/manifest.json', { cache: 'no-store' }); if (!r.ok) return; man = await r.json(); } catch (e) { return; }
  const loader = new GLTFLoader(); let n = 0;
  await Promise.all(Object.entries(man).map(async ([id, cfg]) => {
    const it = ITEM[id]; if (!it || !cfg || !cfg.file) return;
    try {
      const gltf = await loader.loadAsync('models/' + cfg.file);
      const root = gltf.scene; root.rotation.y = cfg.rotY || 0;
      root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
      const wrap = new THREE.Group(); wrap.add(root); wrap.updateMatrixWorld(true);
      let b = new THREE.Box3().setFromObject(wrap); const size = b.getSize(new V3());
      const sc = (cfg.fitW || it.fitW) ? (cfg.fitW || it.fitW) / Math.max(size.x, size.z) : (cfg.h || it.h) / size.y;
      root.scale.multiplyScalar(sc); wrap.updateMatrixWorld(true);

      root.position.x -= c.x; root.position.z -= c.z; root.position.y -= b.min.y; root.position.y += cfg.y || 0;
      if (cfg.r) it.r = cfg.r;

  }));
  if (n) { restore(serialize(), SHOOT && params.get('defer') === '1'); renderCards(); toast(`Tripoモデル ${n} 点を読み込みました`); }
}

    } else {
      const g = e.goal, dx = g.x - e.rec.x, dz = g.z - e.rec.z, dist = Math.hypot(dx, dz);
      const sp = (e.item.id === 'chicken' ? 0.95 : e.item.id === 'sheep' ? 0.6 : 0.5) * e.rec.s;
      let dr = Math.atan2(dx, dz) - e.rec.rot; dr = Math.atan2(Math.sin(dr), Math.cos(dr));
      e.rec.rot += THREE.MathUtils.clamp(dr, -dt * 3.2, dt * 3.2);
      const fwd = Math.max(0, Math.cos(dr)) * sp * dt, nx = e.rec.x + Math.sin(e.rec.rot) * fwd, nz = e.rec.z + Math.cos(e.rec.rot) * fwd;
      g.left -= dt;
      if (dist < 0.12 || g.left <= 0 || !canWalk(e, nx, nz)) { e.goal = null; e.wait = 1.5 + Math.random() * (e.item.id === 'chicken' ? 3 : 6); }
      else {
        e.rec.x = nx; e.rec.z = nz;
        const f = e.item.id === 'chicken' ? 13 : 8, hop = Math.abs(Math.sin(ph * f));
        e.obj.position.set(nx, hop * (e.item.id === 'chicken' ? 0.07 : 0.045) * e.rec.s, nz);
        e.obj.rotation.y = e.rec.rot; e.obj.rotation.z = Math.sin(ph * f) * 0.05;
      }
    }
    if (e.body) {
      if (e.item.anim === 'peck') { const pk = Math.max(0, Math.sin(ph * 2.2)) ** 6; e.body.rotation.x = pk * 0.55; e.body.position.y = Math.abs(Math.sin(ph * 1.3)) * 0.02; }
      else { e.body.position.y = Math.sin(ph * 1.6) * 0.012; if (e.head) e.head.rotation.x = (Math.sin(ph * 0.35) > 0.6 ? 0.45 : 0) * 0.8 + Math.sin(ph * 2) * 0.03; if (e.head) e.head.rotation.y = Math.sin(ph * 0.5) * 0.25; }
    } else if (!drag || drag.e !== e) e.obj.scale.y = e.rec.s * (1 + Math.sin(ph * 1.6) * 0.012);
  }
  waterTex.offset.x = -t * 0.06; waterTex.offset.y = Math.sin(t * 0.7) * 0.02;
  if (selected) {
    selRing.position.set(selected.rec.x, 0.06, selected.rec.z);
    tmp.set(selected.rec.x, selected.obj.position.y + selected.item.h * selected.rec.s + 0.25, selected.rec.z).project(camera);
    const r = canvas.getBoundingClientRect();
    const hw = seltools.offsetWidth / 2 + 6;
    seltools.style.left = Math.min(r.width - hw, Math.max(hw, (tmp.x + 1) / 2 * r.width)) + 'px'; seltools.style.top = Math.max(seltools.offsetHeight + 8, (1 - tmp.y) / 2 * r.height - 6) + 'px';
  }
  renderer.render(scene, camera);
}

renderCards(); updateHint(); resize(); loop();
const tripoReady = params.get('defer') === '1' ? null : loadTripoModels();
if (params.get('layout') === 'sample') restore(JSON.stringify(sampleLayout()), true);
else if (params.get('resume') === '1') { try { const s = localStorage.getItem('ranch-autosave'); if (s) restore(s); } catch (e) { } }

window.__ranch = { placeAt, placed, ITEMS, serialize, restore, setTool, select, camera, controls, sampleLayout, selAction, isValid, tick, loadTripoModels, tripoReady, flyTo, camAction, clearAll,
  toScreen(x, z, y = 0) { const v = new V3(x, y, z).project(camera), r = canvas.getBoundingClientRect(); return [(v.x + 1) / 2 * r.width, (1 - v.y) / 2 * r.height]; },
  setWalk(on) { if (walkOn !== on) camAction('walk'); }, pops };
if (SHOOT) { // recording: an external script steps time and takes the pictures; show a drawn cursor
  const cur = document.createElement('div'); cur.id = 'fakecur';
  cur.innerHTML = '<svg width="34" height="34" viewBox="0 0 24 24"><path d="M5 2.5l13.2 11.4-5.7.5 3.3 6.9-2.6 1.2-3.2-7-4.2 4z" fill="#fff" stroke="#222" stroke-width="1.4" stroke-linejoin="round"/></svg>';
  cur.style.cssText = 'position:fixed;left:-99px;top:-99px;z-index:99;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45));transform:translate(-6px,-3px)';
  document.body.appendChild(cur); document.documentElement.style.cursor = 'none';

  addEventListener('pointerup', () => { cur.style.transform = 'translate(-6px,-3px)'; }, true);
  const st = document.createElement('style'); st.textContent = '*{cursor:none!important}.card{transition:none}#toast{transition:none}#why{display:none!important}'; document.head.appendChild(st);
}
